[package]
name = "catlas-api"
version = "0.1.0"
edition = "2024"
default-run = "catlas-api"

[dependencies]
diesel = { version = "2.3.0", features = ["postgres", "r2d2", "serde_json", "chrono"] }
diesel_migrations = "2.3.0"
postgis_diesel = "3.1.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "trace",
  "http-proto",
  "reqwest-client",
] }
opentelemetry_sdk = { version = "0.32.1", features = [
  "trace",
  "rt-tokio",
  "experimental_trace_batch_span_processor_with_async_runtime",
] }
poem = { version = "3.1.12", features = ["session"] }
poem-openapi = { version = "5.1.16", features = ["scalar", "chrono"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = { version = "0.1.44" }
tracing-opentelemetry = { version = "0.33.0" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.32.1", features = ["testing"] }
