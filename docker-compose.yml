services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: catlas-postgis
    environment:
      POSTGRES_DB: catlas
      POSTGRES_USER: catlas
      POSTGRES_PASSWORD: catlas
    ports:
      - "5432:5432"
    volumes:
      - catlas-postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catlas -d catlas"]
      interval: 5s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: catlas-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "9411:9411"

volumes:
  catlas-postgis-data:
